name: CI

on:
  pull_request:
  workflow_dispatch:

# WR-03: least privilege — CI only reads; it never commits or deploys.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build and validate
        working-directory: site
        run: |
          npm run build
          node scripts/validate/all.mjs

  pipeline:
    name: Pipeline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run tests
        run: pytest pipeline/tests/ -q

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # H-03/F-95: this job previously ran `rhysd/actionlint@v1` directly, a
      # wrapper whose shellcheck-wiring silently disables shell linting when
      # misconfigured (the exact defect class F-85's armed-check + canary exist
      # to close). The shipped, canary-armed, SHA-pinned instrument
      # (.github/scripts/lint-workflows.sh) had zero callers until this line.
      # F-95 explicitly REJECTS adding a `push: branches: [master]` trigger to
      # this file: that would run build+validate on every push to a live repo,
      # where `freshness` can go red purely from data age (F-19), manufacturing
      # a recurring red CI signal. Master-push linting is NOT covered by CI; it
      # is covered by running this gate locally before every push (documented
      # in DEPLOYMENT.md).
      - name: Lint workflows (armed instrument, F-85/H-03)
        run: bash .github/scripts/lint-workflows.sh
