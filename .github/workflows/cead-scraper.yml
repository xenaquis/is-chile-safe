name: CEAD Scraper (Quarterly)

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: cead-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    # CR-01: CF_HOOK MUST be job-level — a step-level env var is NOT in scope for
    # that same step's `if:` condition, so the deploy gate would never fire.
    env:
      CF_HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Run CEAD scraper
        run: python pipeline/scrape_cead.py

      - name: Build ENUSC victimization snapshot
        continue-on-error: true
        env:
          CACHE_ONLY: '1'
        run: python pipeline/snapshots/fetch_enusc_vhdv.py

      - name: Enrich commune JSONs with ENUSC VHDV
        continue-on-error: true
        run: python pipeline/build_enusc_enrichment.py

      - name: Build composite index
        continue-on-error: true
        run: python pipeline/build_composite_index.py

      - name: Build map payload
        continue-on-error: true
        run: python pipeline/build_map_payload.py

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: auto-update CEAD [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true' && env.CF_HOOK != ''
        run: curl -X POST --fail --silent --show-error --retry 3 "$CF_HOOK"

      - name: Alert via GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "CEAD Scraper failed again: $RUN_URL"
          else
            gh issue create \
              --label pipeline-failure \
              --title "[pipeline] CEAD Scraper failed on $(date -u +%F)" \
              --body "Pipeline run failed: $RUN_URL"
          fi
