name: CEAD Scraper (Quarterly)

on:
  schedule:
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: cead-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # CR-01: CF_HOOK MUST be job-level — a step-level env var is NOT in scope for
    # that same step's `if:` condition, so the deploy gate would never fire.
    env:
      CF_HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Run CEAD scraper
        run: python pipeline/scrape_cead.py

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: auto-update CEAD [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.changed == 'true' && env.CF_HOOK != ''
        run: curl -X POST --fail --silent --show-error --retry 3 "$CF_HOOK"
