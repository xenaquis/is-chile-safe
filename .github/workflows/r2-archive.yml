name: R2 Research Archive

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: r2-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CRON-01 (F-76), amended F-94/M-05: only the three credentials
      # pipeline/archive_r2.py:458 actually declares as required_vars are guarded.
      # R2_BUCKET is NOT one of them -- archive_r2.py:475 defaults it to
      # "ischilesafe" deliberately (an `or` fallback, because GitHub Actions injects
      # unset secrets as empty strings, so a plain .get() default never kicks in).
      # There is also no R2_BUCKET secret/variable in this repo (verified via
      # `gh secret list` / `gh variable list`) -- guarding it here would make an
      # optional, defaulted value a hard outage on a correct tree (H-01).
      # Corrected baseline (M-05): missing/blank required vars in archive_r2.py do
      # NOT raise -- they log a warning and `return 0` (a clean, silent no-op, see
      # archive_r2.py:458-467). This guard's real value is converting that silent
      # no-op into a loud, named failure -- not "adding a name to an exception that
      # already alerted," which was the incorrect original claim.
      - name: Guard required secrets
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash .github/scripts/require-env.sh R2_ENDPOINT_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Archive incidents to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARCHIVE_MAX_FETCH: '100'
        run: python pipeline/archive_r2.py

      # M-02: also (re)create the SHARED `pipeline-failure` label here, not only the
      # per-pipeline one. `gh issue create` below passes both labels and fails
      # outright if either does not exist -- if `pipeline-failure` is ever deleted or
      # renamed, every pipeline's first alert issue creation would fail and the
      # alert about the original failure would be lost (the exact unrecoverable mode
      # this label-creation step exists to prevent).
      - name: Ensure alert label exists
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure-r2 --color e11d48 --description "R2 Archive failure alert" --force
          gh label create pipeline-failure --color e11d48 --description "Shared pipeline failure alert" --force

      - name: Alert via GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label pipeline-failure-r2 --state open --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "R2 Archive failed again: $RUN_URL"
          else
            gh issue create \
              --label pipeline-failure-r2 \
              --label pipeline-failure \
              --title "[pipeline] R2 Archive failed on $(date -u +%F)" \
              --body "R2 Archive run failed: $RUN_URL"
          fi
