name: R2 Research Archive

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: r2-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # CRON-01 (F-76): all four R2 credentials are required. Unlike news-pipeline/
      # cead-scraper, F-84 does not apply here -- this job has no separate
      # "collect vs publish" split to protect; the archive step IS the only step.
      # Today an empty credential reaches boto3 and raises a generic exception deep
      # inside pipeline/archive_r2.py (RESEARCH.md) -- that already alerts, but with
      # no named cause. Fail loudly, first, with the variable name.
      - name: Guard required secrets
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash .github/scripts/require-env.sh R2_ENDPOINT_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Archive incidents to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ARCHIVE_MAX_FETCH: '100'
        run: python pipeline/archive_r2.py

      - name: Ensure alert label exists
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create pipeline-failure-r2 --color e11d48 --description "R2 Archive failure alert" --force

      - name: Alert via GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label pipeline-failure-r2 --state open --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "R2 Archive failed again: $RUN_URL"
          else
            gh issue create \
              --label pipeline-failure-r2 \
              --label pipeline-failure \
              --title "[pipeline] R2 Archive failed on $(date -u +%F)" \
              --body "R2 Archive run failed: $RUN_URL"
          fi
