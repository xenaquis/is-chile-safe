name: News Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_backup:
        type: boolean
        default: false
        description: "Start this run on the DeepSeek-direct backup (NREC-04 live check)"

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    # CF_HOOK is job-level so both the post-commit guard step and the deploy step's
    # run: can read it. NOTE (F-76/F-84): the old `if: ... && env.CF_HOOK != ''` gate
    # was DELETED in Phase 32 -- an empty hook is now a hard failure at its own guard
    # step (placed AFTER the data commit, F-84), not a silent skip and not coupled to
    # data collection. Do not reintroduce the `if: ... && env.CF_HOOK` clause.
    # (CR-01 history: a step-level env var is not in scope for that step's own `if:`.)
    env:
      CF_HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}

    steps:
      # fetch-depth: 0 (CRON-06) -- push-with-rebase.sh's `git rebase FETCH_HEAD`
      # needs real history to compute a merge-base; a shallow (depth-1) checkout can
      # leave the rebase without a common ancestor if origin has moved forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] this job pushes via push-with-rebase.sh and needs
          # the persisted credential; persist-credentials:false would break the push.

      # CRON-01 (F-76, amended F-84, F-94/M-01): only the secrets the SCRAPE itself
      # needs are guarded here. CF_DEPLOY_HOOK_URL is guarded separately, AFTER the
      # commit step below -- putting it here would mean a rotated deploy hook kills
      # the scrape four times a day and RSS items age out of their feeds
      # permanently, not just the publish step.
      #
      # DEEPSEEK_API_KEY is intentionally NOT guarded (M-01, amended 34-03/NREC-04):
      # scrape_news.py selects its primary API key by provider, defaulting to
      # `openrouter` -> OPENROUTER_API_KEY. DEEPSEEK_API_KEY is now the NREC-04
      # backup: ProviderRouter fails over to it when the primary breaker trips, or
      # immediately when NEWS_FORCE_BACKUP=true (force_backup dispatch input) or
      # NEWS_PROVIDER=deepseek. A missing backup key only matters when the primary
      # fails -- and then G-04(c) fails the job loudly (post-commit Health gate
      # below), rather than a hard guard here making a key that is usually unused
      # load-bearing for every 6-hourly run. It stays in the scrape step's `env:`
      # below so the backup/alternative provider works whenever selected.
      - name: Guard required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash .github/scripts/require-env.sh OPENROUTER_API_KEY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      - name: Run news scraper
        id: scrape
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_RUN_SUMMARY_PATH: ${{ runner.temp }}/news-run-summary.json
          NEWS_FORCE_BACKUP: ${{ inputs.force_backup }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
          NEWS_BACKUP_MODEL: ${{ vars.NEWS_BACKUP_MODEL }}
          NEWS_PROVIDER: ${{ vars.NEWS_PROVIDER }}
        run: python pipeline/scrape_news.py

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: auto-update news [skip ci]"
            bash .github/scripts/push-with-rebase.sh master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            bash .github/scripts/news-deploy-needed.sh HEAD~1 HEAD >> "$GITHUB_OUTPUT" || { echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "::warning::news-deploy-needed failed; deploying (fail-open)"; }
          fi

      # CRON-01 (F-76, amended F-84): CF_DEPLOY_HOOK_URL is REQUIRED, not optional --
      # but placed HERE, after the commit, so a rotated hook cannot also stop data
      # collection. The job still fails hard and still alerts; the corpus survives.
      # Guards CF_HOOK (the job-level alias the curl step actually consumes), not the
      # CF_DEPLOY_HOOK_URL secret name -- a rename of the alias would otherwise leave
      # the curl unguarded while a guard on the wrong name still passed.
      - name: Guard deploy hook
        run: bash .github/scripts/require-env.sh CF_HOOK

      # CRON-03 (F-78): canonical deploy-hook invocation, byte-identical across
      # news-pipeline.yml, cead-scraper.yml, deploy-on-code.yml (grep-provable, see
      # Wave 2 verify block).
      # FRESH-04/V-12 (35-02): deploy only when the committed diff (HEAD~1..HEAD after
      # the push) touches the served incident set -- data/incidents/current.json or
      # data/incidents/archive/. seen.json / rejected/ / pending.json still commit but
      # no longer redeploy. R-09: that decision (news-deploy-needed.sh) runs AFTER the
      # commit + push and fails OPEN (deploy=true + ::warning::), so it can never block
      # data collection (F-84).
      - name: Trigger Cloudflare Pages deploy
        if: steps.commit.outputs.deploy == 'true'
        run: curl -X POST --fail --silent --show-error --retry 3 --retry-all-errors --max-time 60 "$CF_HOOK"

      # V-03 design constraint (34-03, NREC-07/G-04, amended G-09): this MUST run
      # post-commit, not gate the scrape step itself -- a non-zero exit from
      # scrape_news.py would skip "Commit data if changed" entirely, discarding a
      # real (if partial) corpus. Placing the classification-health check here
      # instead means a total or partial classification failure still commits
      # whatever was collected, still fails the job loudly, and the existing
      # `if: failure()` alert steps below provide the (deduped) issue alert --
      # no separate alert logic needed for this step.
      - name: Health gate (NREC-07 / G-04)
        env:
          NEWS_RUN_SUMMARY_PATH: ${{ runner.temp }}/news-run-summary.json
        run: python pipeline/news_health_gate.py "$NEWS_RUN_SUMMARY_PATH"

      # F-87: label creation is hoisted into its own step, separate from the alert
      # step, with continue-on-error: true. Under GitHub's default bash -e, if
      # `gh label create` itself failed (rate limit, transient 5xx) as the FIRST line
      # of the old combined alert step, the alert about the ORIGINAL failure would be
      # lost silently -- the one unrecoverable failure mode in this phase. This is a
      # declarative, UI-visible allowance on a non-critical prep step, not the banned
      # `|| true` (which would hide the status inside the same step's own exit code).
      - name: Ensure alert label exists
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure-news --color e11d48 --description "News Pipeline failure alert" --force
          gh label create pipeline-failure --color e11d48 --description "Shared pipeline failure alert" --force

      - name: Alert via GitHub Issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label pipeline-failure-news --state open --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "News Pipeline failed again: $RUN_URL"
          else
            gh issue create \
              --label pipeline-failure-news \
              --label pipeline-failure \
              --title "[pipeline] News Pipeline failed on $(date -u +%F)" \
              --body "Pipeline run failed: $RUN_URL"
          fi
